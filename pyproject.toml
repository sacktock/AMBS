[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambs"
version = "0.1.0"
description = "Approximate model-based shielding for safe reinforcement learning with DreamerV3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jax==0.4.30",
  "jaxlib==0.4.30",
  "numpy==1.26.4",
  "optax==0.2.5",
  "chex==0.1.87",
  "tensorflow-cpu==2.17.0",
  "tensorflow-probability==0.24.0",
  "tf-keras==2.17.0",
  "scipy==1.11.4",
  "ruamel.yaml>=0.17.21,<0.18.0",
  "gym==0.25.2",
  "gymnasium>=1.3.0",
  "ale-py>=0.11.2",
  "opencv-python>=4.11.0.86",
  "cloudpickle>=1.6.0",
  "pillow>=10.4.0",
  "typer>=0.12.3",
]

[project.scripts]
ambs = "ambs.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ambs", "ambs.*"]

[tool.setuptools.package-data]
ambs = ["**/configs.yaml"]

[dependency-groups]
dev = ["pytest>=9.0.3"]
cuda12 = ["jax[cuda12]==0.4.30"]
# Atari ROM installer for the CI smoke job. Not part of the default install.
smoke = ["autorom[accept-rom-license]>=0.6.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
